name: Build Lavender Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip curl python3
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          mkdir clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" | tar -xz -C clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Integrate Features (KSU Next, SUSFS, Dynamic Uptime)
        run: |
          # Git Config
          git config user.name "Portnoy158"
          git config user.email "portnoy@example.com"

          # ============================================
          # 1. Integrate KernelSU Next (cara resmi)
          # ============================================
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # Enable config KSU
          echo "CONFIG_KSU=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/lavender-perf_defconfig

          # ============================================
          # 2. Integrate SUSFS (v1.5.5 for Kernel 4.4)
          # ============================================
          git clone https://github.com/sidex15/ksu_susfs.git -b 4.4 susfs_patcher || true
          if [ -d "susfs_patcher" ]; then
            cp -r susfs_patcher/fs/susfs fs/ 2>/dev/null || true
            cp susfs_patcher/include/linux/susfs.h include/linux/ 2>/dev/null || true
            
            patch -p1 < susfs_patcher/patches/fs/open.c.patch 2>/dev/null || true
            patch -p1 < susfs_patcher/patches/fs/stat.c.patch 2>/dev/null || true
            patch -p1 < susfs_patcher/patches/fs/dcache.c.patch 2>/dev/null || true
          fi

          # ============================================
          # 3. Dynamic Uptime Hack (Permission Fix: 0644)
          # ============================================
          echo '#include <linux/moduleparam.h>' >> kernel/time/timekeeping.c
          echo 'static int fake_uptime_sec = 86400;' >> kernel/time/timekeeping.c
          echo 'module_param(fake_uptime_sec, int, 0644);' >> kernel/time/timekeeping.c
          echo 'MODULE_PARM_DESC(fake_uptime_sec, "Offset uptime in seconds");' >> kernel/time/timekeeping.c

          sed -i '/ts->tv_sec = tk->tkr_mono.xtime_sec + tk->wall_to_monotonic.tv_sec;/a \    ts->tv_sec += fake_uptime_sec;' kernel/time/timekeeping.c


      - name: Build Kernel Image
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out lavender-perf_defconfig
          make -j$(nproc --all) O=out HOSTCFLAGS="-fcommon" HOSTCXXFLAGS="-fcommon"

      - name: Pack to AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3

          # Overwrite anykernel.sh (tanpa indentasi di dalam file)
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 by osm0sis @ xda-developers

          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Lavender-KSU-SUSFS-Uptime
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lavender
          device.name2=Lavender
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # shell variables
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;

          ## AnyKernel file attributes
          # set permissions/ownership for included files
          # (opsional, biasanya tidak perlu diubah)

          ## AnyKernel boot install
          dump_boot;

          write_boot;
          ## end boot install
          EOF

          zip -r9 ../Lavender-KSU-SUSFS-Uptime.zip * -x .git README.md



      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Lavender-Kernel-Final
          path: Lavender-KSU-SUSFS-Uptime.zip

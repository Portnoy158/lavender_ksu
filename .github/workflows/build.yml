name: Build Lavender Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip curl python3
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          mkdir clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" | tar -xz -C clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Integrate Features (KSU Next + Manual Hooks + SUSFS + Uptime)
        run: |
          git config user.name "Portnoy158"
          git config user.email "portnoy@example.com"

          # 1. KernelSU Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # Fix in_compat_syscall for kernel 4.4
          if [ -f drivers/kernelsu/sulog/event.c ]; then
            sed -i 's/unlikely(in_compat_syscall())/unlikely(is_compat_task())/g' drivers/kernelsu/sulog/event.c
          fi

                    # Fix ALIGN_DOWN for kernel 4.4
          if [ -f drivers/kernelsu/feature/adb_root.c ]; then
            sed -i 's/ALIGN_DOWN/ALIGN/g' drivers/kernelsu/feature/adb_root.c
          fi

          # Fix __nocfi untuk kernel 4.4 di selinux_hide.c
          if [ -f drivers/kernelsu/feature/selinux_hide.c ]; then
            sed -i 's/__nocfi //g' drivers/kernelsu/feature/selinux_hide.c
          fi

          echo "CONFIG_KSU=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/lavender-perf_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/lavender-perf_defconfig


          # 2. Manual Hooks (versi aman dulu)

          # fs/exec.c
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            sed -i '/int do_execve(struct filename \*filename,/i#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t\tvoid *argv, void *envp, int *flags);\n#endif' fs/exec.c
            sed -i '/return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);/i#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, \&filename, \&argv, \&envp, 0);\n#endif' fs/exec.c
          fi

          # fs/open.c
          if ! grep -q "ksu_handle_faccessat" fs/open.c; then
            sed -i '/SYSCALL_DEFINE3(faccessat, int, dfd, const char __user \*, filename, int, mode)/i#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *mode, int *flags);\n#endif' fs/open.c
            sed -i '/if (mode \& \~S_IRWXO)/i#ifdef CONFIG_KSU\n\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n#endif' fs/open.c
          fi

          # fs/stat.c
          if ! grep -q "ksu_handle_stat" fs/stat.c; then
            sed -i '/SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user \*, filename,/i#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *flags);\n#endif' fs/stat.c
            sed -i '/error = vfs_fstatat(dfd, filename, \&stat, flag);/i#ifdef CONFIG_KSU\n\tksu_handle_stat(\&dfd, \&filename, \&flag);\n#endif' fs/stat.c
          fi

          # kernel/reboot.c
          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            sed -i '/SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,/i#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif' kernel/reboot.c
            sed -i '/if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))/i#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, \&arg);\n#endif' kernel/reboot.c
          fi

          echo "[+] Manual hooks applied (read skipped for now)"

          # 3. SUSFS
          git clone https://github.com/sidex15/ksu_susfs.git -b 4.4 susfs_patcher || true
          if [ -d "susfs_patcher" ]; then
            cp -r susfs_patcher/fs/susfs fs/ 2>/dev/null || true
            cp susfs_patcher/include/linux/susfs.h include/linux/ 2>/dev/null || true
            patch -p1 < susfs_patcher/patches/fs/open.c.patch 2>/dev/null || true
            patch -p1 < susfs_patcher/patches/fs/stat.c.patch 2>/dev/null || true
            patch -p1 < susfs_patcher/patches/fs/dcache.c.patch 2>/dev/null || true
          fi

          # 4. Dynamic Uptime
          if ! grep -q "fake_uptime_sec" kernel/time/timekeeping.c; then
            echo '#include <linux/moduleparam.h>' >> kernel/time/timekeeping.c
            echo 'static int fake_uptime_sec = 86400;' >> kernel/time/timekeeping.c
            echo 'module_param(fake_uptime_sec, int, 0644);' >> kernel/time/timekeeping.c
            echo 'MODULE_PARM_DESC(fake_uptime_sec, "Offset uptime in seconds");' >> kernel/time/timekeeping.c
            sed -i '/ts->tv_sec = tk->tkr_mono.xtime_sec + tk->wall_to_monotonic.tv_sec;/a \    ts->tv_sec += fake_uptime_sec;' kernel/time/timekeeping.c
          fi


      - name: Build Kernel Image
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out lavender-perf_defconfig
          make -j$(nproc --all) O=out HOSTCFLAGS="-fcommon" HOSTCXXFLAGS="-fcommon"

      - name: Pack to AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3

          # Overwrite anykernel.sh (tanpa indentasi di dalam file)
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 by osm0sis @ xda-developers

          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Lavender-KSU-SUSFS-Uptime
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lavender
          device.name2=Lavender
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # shell variables
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;

          ## AnyKernel file attributes
          # set permissions/ownership for included files
          # (opsional, biasanya tidak perlu diubah)

          ## AnyKernel boot install
          dump_boot;

          write_boot;
          ## end boot install
          EOF

          zip -r9 ../Lavender-KSU-SUSFS-Uptime.zip * -x .git README.md



      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Lavender-Kernel-Final
          path: Lavender-KSU-SUSFS-Uptime.zip
